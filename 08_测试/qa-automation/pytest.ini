[pytest]
testpaths = ../../05_代码/backend/tests testcases
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers --alluredir=reports/allure-results --clean-alluredir -p no:cacheprovider
markers =
    integration: 需要本机 MySQL 53306 的真实集成测试（CI 无 DB 自动 skip）
    p0: P0 核心链路用例（导出 p0_cases.json，用于冒烟回归）
    l2: L2 存储过程 / SQL 层集成测试
    l3: L3 DB 中间件集成测试（事务 / 锁）
    l4: L4 端到端主路径测试
filterwarnings =
    ignore::DeprecationWarning
